.logo{width:96px;height:66px;object-fit:cover;border-radius:12px;display:block;margin-bottom:14px}
h1{font-size:34px;line-height:1.25;margin:0 0 8px;font-weight:800}
header p{margin:0;color:var(--mute);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--main);font-weight:800;line-height:1.2}
.stat span{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:8px;margin:8px 0 16px;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 18px;border-radius:99px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--main);color:var(--bg);border-color:var(--main)}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.item{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--main);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.item.help{border-inline-start-color:var(--acc)}
.item h3{margin:0 0 2px;font-size:19px}
.meta{color:var(--mute);font-size:14px;margin-bottom:6px}
.item p{margin:0 0 8px}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 10px}
h2{font-size:22px;margin:30px 0 10px}
.about{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.contact a{flex:1 1 140px;text-align:center;text-decoration:none;font-weight:600;padding:11px;border-radius:8px;background:var(--main);color:var(--bg)}
.contact a.wa{background:var(--acc);color:#14211f}
footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 0 30px}
.item ul{margin:6px 0 0;padding-inline-start:20px}.item li{margin-bottom:2px}.note{font-size:14px;color:var(--mute)}
</style>
</head>

];

 });
